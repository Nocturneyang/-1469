apiVersion: v1
kind: ServiceAccount
metadata:
  name: social-monitor
  namespace: g1469
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: social-monitor-sqlite-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-monitor
  labels:
    app.kubernetes.io/name: social-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-monitor
    spec:
      serviceAccountName: social-monitor
      containers:
        - name: social-monitor
          image: __IMAGE__
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /data
            - name: DISABLE_MEDIA_UPLOAD
              value: "1"
            - name: PURGE_MEDIA_ON_START
              value: "1"
            - name: DB_DEGRADED_BOOT
              value: "0"
            - name: DB_MAINTENANCE_MODE
              value: "0"
            - name: DB_READONLY_MODE
              value: "0"
            - name: COLLECTOR_WRITE_DISABLED
              value: "0"
            - name: ANALYTICS_MAINTENANCE_MODE
              value: "0"
            - name: SQLITE_RECOVERY_ON_START
              value: "0"
            - name: MEDIA_BASE_URL
              value: https://social-monitor.tyhark.com
            - name: SKIP_CHROME_INSTALL
              value: "true"
            - name: PUPPETEER_SKIP_DOWNLOAD
              value: "true"
            - name: LOCAL_WA_RUNTIME_ENABLED
              value: "false"
            - name: LOCAL_TG_RUNTIME_ENABLED
              value: "false"
            - name: CLOUD_COLLECTOR_ENABLED
              value: "true"
            - name: CLOUD_COLLECTOR_IMAGE
              value: __IMAGE__
            - name: CLOUD_COLLECTOR_API_URL
              value: https://social-monitor.tyhark.com
            - name: CLOUD_COLLECTOR_SECRET_NAME
              value: social-monitor-secrets
            - name: CLOUD_COLLECTOR_PVC
              value: social-monitor-sqlite-pvc
            - name: DEPLOY_HUB_API_URL
              value: "https://skyline-ark-deploy-hub-mcp.tyhark.com/mcp"
            - name: DEPLOY_HUB_NAMESPACE
              value: "g1469"
            - name: DEPLOY_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: DEPLOY_HUB_TOKEN
                  optional: true
            - name: CLOUD_COLLECTOR_SUPERVISOR_INTERVAL_MS
              value: "30000"
            - name: ACCOUNT_SESSION_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: ACCOUNT_SESSION_ENCRYPTION_KEY
                  optional: true
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_LOGIN_URL
              value: "https://skyline-ark-sso.tyhark.com/login"
            - name: SSO_LOGOUT_URL
              value: "https://skyline-ark-sso.tyhark.com/logout"
            - name: SSO_REDIRECT_PARAM
              value: "redirect"
            - name: SSO_LOGOUT_REDIRECT_PARAM
              value: "redirect"
            - name: STORAGE_MIN_FREE_MB
              value: "512"
            - name: STORAGE_MIN_FREE_PERCENT
              value: "5"
            - name: TG_API_ID_TGU_SUPPLIER
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_API_ID_TGU_SUPPLIER
                  optional: true
            - name: TG_API_HASH_TGU_SUPPLIER
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_API_HASH_TGU_SUPPLIER
                  optional: true
            - name: TG_USER_SESSION_TGU_SUPPLIER
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_USER_SESSION_TGU_SUPPLIER
                  optional: true
            - name: TG_API_ID_LAFFIC_SERVICE
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_API_ID_LAFFIC_SERVICE
                  optional: true
            - name: TG_API_HASH_LAFFIC_SERVICE
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_API_HASH_LAFFIC_SERVICE
                  optional: true
            - name: TG_USER_SESSION_LAFFIC_SERVICE
              valueFrom:
                secretKeyRef:
                  name: social-monitor-secrets
                  key: TG_USER_SESSION_LAFFIC_SERVICE
                  optional: true
          envFrom:
            - secretRef:
                name: social-monitor-secrets
                optional: true
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: social-monitor-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: social-monitor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: social-monitor
