apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: social-monitor-sqlite-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-monitor
  labels:
    app.kubernetes.io/name: social-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-monitor
    spec:
      containers:
        - name: social-monitor
          image: __IMAGE__
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /data
            - name: MEDIA_BASE_URL
              value: https://social-monitor.tyhark.com
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: social-monitor-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: social-monitor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: social-monitor
