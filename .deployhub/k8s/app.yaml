apiVersion: v1
kind: ServiceAccount
metadata:
  name: social-monitor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: social-monitor-wa-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: social-monitor-wa-orchestrator
subjects:
  - kind: ServiceAccount
    name: social-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: social-monitor-wa-orchestrator
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: social-monitor-sqlite-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nas
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-monitor
  labels:
    app.kubernetes.io/name: social-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-monitor
    spec:
      serviceAccountName: social-monitor
      containers:
        - name: social-monitor
          image: __IMAGE__
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /data
            - name: MEDIA_BASE_URL
              value: https://social-monitor.tyhark.com
            - name: SKIP_CHROME_INSTALL
              value: "true"
            - name: PUPPETEER_SKIP_DOWNLOAD
              value: "true"
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_LOGIN_URL
              value: "https://skyline-ark-sso.tyhark.com/login"
            - name: STORAGE_MIN_FREE_MB
              value: "512"
            - name: STORAGE_MIN_FREE_PERCENT
              value: "5"
          envFrom:
            - secretRef:
                name: social-monitor-secrets
                optional: true
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: social-monitor-sqlite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: social-monitor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: social-monitor
